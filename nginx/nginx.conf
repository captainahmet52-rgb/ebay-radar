events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Genel ayarlar ────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  # ── Gzip ────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ── Rate limiting ────────────────────────────────────────────────────────
  # Genel API: 60 istek/dakika
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
  # Auth endpointi: 10 istek/dakika (brute-force koruması)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # ── Upstream ─────────────────────────────────────────────────────────────
  upstream nextjs {
    server app:3000;
    keepalive 32;
  }

  # ── HTTP Server ──────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Güvenlik header'ları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── eBay Webhook — büyük body, uzun timeout ──────────────────────────
    location /api/webhooks/ {
      proxy_pass http://nextjs;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      client_max_body_size 10m;
      proxy_read_timeout   30s;
      proxy_send_timeout   30s;
      proxy_connect_timeout 10s;
    }

    # ── Auth endpointleri — sıkı rate limit ─────────────────────────────
    location /api/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ── Genel API — rate limit ───────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      limit_req_status 429;

      proxy_pass http://nextjs;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      client_max_body_size 1m;
      proxy_read_timeout   15s;
    }

    # ── Next.js statik varlıklar — 1 yıl önbellekle ─────────────────────
    location /_next/static/ {
      proxy_pass http://nextjs;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ── Next.js imaj optimizasyon endpointi ─────────────────────────────
    location /_next/image {
      proxy_pass http://nextjs;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header Cache-Control "public, max-age=86400";
    }

    # ── Tüm diğer istekler → Next.js (WebSocket desteğiyle) ─────────────
    location / {
      proxy_pass http://nextjs;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket desteği (Next.js HMR / gerçek zamanlı)
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout   60s;
      proxy_send_timeout   60s;
      proxy_connect_timeout 10s;
    }
  }
}
