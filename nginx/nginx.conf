events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ── Genel ayarlar ────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  # ── Docker iç DNS — dinamik upstream çözümlemesi için ───────────────────
  resolver 127.0.0.11 valid=30s ipv6=off;

  # ── Gzip ────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # ── Rate limiting ────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  # ── HTTP Server ──────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Upstream değişkeni — nginx başlarken DNS çözmez, istek anında çözer
    set $upstream http://app:3000;

    # Güvenlik header'ları
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── eBay Webhook — büyük body, uzun timeout ──────────────────────────
    location /api/webhooks/ {
      proxy_pass $upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      client_max_body_size 10m;
      proxy_read_timeout   30s;
      proxy_send_timeout   30s;
      proxy_connect_timeout 10s;
    }

    # ── Auth endpointleri — sıkı rate limit ─────────────────────────────
    location /api/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      limit_req_status 429;

      proxy_pass $upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ── Toplu ürün yükleme — 1000 ASIN'e kadar tek istekte işlenir. Kod
    #    ASIN sayısından bağımsız sabit sayıda DB sorgusu kullanır ama yine de
    #    genel /api/ 15sn tavanından daha geniş pay bırakılır (DB yoğunluğu vb.).
    location /api/products/bulk {
      limit_req zone=api_limit burst=20 nodelay;
      limit_req_status 429;

      proxy_pass $upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      client_max_body_size 2m;
      proxy_read_timeout   60s;
    }

    # ── Genel API — rate limit ───────────────────────────────────────────
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      limit_req_status 429;

      proxy_pass $upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      client_max_body_size 1m;
      proxy_read_timeout   15s;
    }

    # ── Next.js statik varlıklar — 1 yıl önbellekle ─────────────────────
    location /_next/static/ {
      proxy_pass $upstream;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    # ── Next.js imaj optimizasyon endpointi ─────────────────────────────
    location /_next/image {
      proxy_pass $upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      add_header Cache-Control "public, max-age=86400";
    }

    # ── Tüm diğer istekler → Next.js (WebSocket desteğiyle) ─────────────
    location / {
      proxy_pass $upstream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_read_timeout   60s;
      proxy_send_timeout   60s;
      proxy_connect_timeout 10s;
    }
  }
}
