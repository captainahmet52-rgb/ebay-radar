<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Lean Automation</title>
</head>
<body>
  <header class="hd">
    <div class="brand">
      <div class="logo">LA</div>
      <div>
        <p class="name">Lean Automation</p>
        <p class="sub">Amazon ASIN Grabber</p>
      </div>
    </div>
    <span id="status" class="status">Hazır</span>
  </header>

  <main class="body">
    <p class="info">
      Amazon arama sayfasını aç — sağda beliren <b>panel</b>le ürünleri filtrele,
      ASIN topla. Buradan da kopyalayabilirsin.
    </p>

    <div class="row count-row">
      <span>Seçili ASIN'ler</span>
      <span id="count" class="badge">0</span>
    </div>

    <div class="list" id="list">
      <p class="empty">Amazon'da ürün seçin…</p>
    </div>

    <div class="actions">
      <button id="copy" class="btn primary">Kopyala</button>
      <button id="clear" class="btn ghost">Listeyi temizle</button>
    </div>

    <p id="msg" class="msg"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
