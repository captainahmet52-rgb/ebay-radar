<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="popup.css" />
  <title>Lean Automation</title>
</head>
<body>
  <header class="hd">
    <div class="brand">
      <div class="logo">LA</div>
      <div>
        <p class="name">Lean Automation</p>
        <p class="sub">Amazon ASIN Grabber</p>
      </div>
    </div>
    <span id="status" class="status">● Hazır</span>
  </header>

  <main class="body">
    <div class="info" id="info">
      <b>Amazon arama sayfasını aç.</b><br />
      Sağdaki <b>panel</b> ile ürünleri filtrele, ASIN topla. Buradan da kopyalayabilirsin.
    </div>

    <div class="row count-row">
      <span>Seçili ASIN'ler</span>
      <span id="count" class="badge">0</span>
    </div>

    <div class="list" id="list">
      <p class="empty">Amazon'da ürün seçin…</p>
    </div>

    <div class="actions">
      <button id="copy" class="btn green">Kopyala</button>
      <button id="clear" class="btn danger">Listeyi Temizle</button>
    </div>

    <p id="msg" class="msg"></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
