services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ebay_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ebay_db
      POSTGRES_USER: ebay_user
      POSTGRES_PASSWORD: ebay_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebay_user -d ebay_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ebay_net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ebay_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ebay_net

  # ── Prisma Migrate (app/worker'dan önce çalışır, bir kez) ─────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: ebay_migrate
    env_file: .env
    environment:
      # FAIL-FAST migrate: en kritik deploy hatası "migration SONSUZA kadar takılır →
      # app hiç başlamaz → site 000'da kalır" senaryosuydu. lock_timeout, bir DDL'in
      # kilit beklemesini 30sn ile sınırlar (eski app/worker bir tabloyu meşgul ederse
      # migration süresiz beklemez, net hata verir). statement_timeout tek komutu 5dk ile
      # kapar. Böylece migrate ya başarılı olur ya da HIZLI/GÖRÜNÜR şekilde fail eder —
      # asla sonsuza kadar asılı kalmaz. (Prisma 5.x `?options=` bağlantı parametresini destekler.)
      DATABASE_URL: "postgresql://ebay_user:ebay_pass@postgres:5432/ebay_db?options=-c%20lock_timeout%3D30s%20-c%20statement_timeout%3D300s"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebay_net
    restart: "no"
    # SELF-HEAL: order_dedup migration ilk denemede FAIL etti → _prisma_migrations'ta
    # "failed" kaldı → sonraki deploy'lar P3009 ile bloke olur. Önce o kaydı rolled-back
    # işaretle (zaten temizse hata yutulur), SONRA deploy et (migration artık no-op → geçer).
    command:
      - sh
      - -c
      - |
        node_modules/.bin/prisma migrate resolve --rolled-back 20260628000000_order_dedup_unique || true
        node_modules/.bin/prisma migrate deploy

  # ── Next.js App ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner   # açık hedef: yeni stage eklenince app'in default hedefi kaymasın
    container_name: ebay_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Coolify sihirli değişkeni: app servisini 3000 portunda + domaine bağlar.
      # (Traefik loadbalancer port'unu deterministik yapar — redeploy'da kaybolmaz.)
      SERVICE_FQDN_APP_3000: "https://leanautomation.pro"
      DATABASE_URL: postgresql://ebay_user:ebay_pass@postgres:5432/ebay_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    # 🔴 migrate'e BAĞLI DEĞİL (bilinçli, 2026-06-28). Eskiden `migrate:
    # service_completed_successfully` vardı → migration FAIL/HANG edince app/worker HİÇ
    # başlamıyor, site komple 503 oluyordu (tek hata noktası). Artık migrate ayrı çalışır;
    # fail etse bile app/worker ayağa kalkar. Migration'lar additive + app eksik kısıtla
    # zarif çalışır (ör. order dedup → DB unique yoksa findFirst guard devrede).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ebay_net
    # Yalnızca loopback'e yayınla — Coolify/Traefik container AĞI üzerinden bağlanır,
    # host portuna ihtiyacı yok. 0.0.0.0:3000 açık olursa proxy (ve rate-limit,
    # X-Forwarded-For güveni) tamamen atlanabilir.
    ports:
      - "127.0.0.1:3000:3000"
    # 🔴 HER DEPLOY'DA 504 SORUNUNUN ÇÖZÜMÜ:
    # Healthcheck OLMAYINCA Coolify, container "started" der demez Traefik routing'ini
    # kuruyor — ama app henüz HTTP serve etmiyor / eski ölü backend'e yönlendiriliyor →
    # kalıcı 504 (elle Stop→Start gerekiyordu). Bu healthcheck ile Coolify, container
    # "healthy" olana kadar BEKLER, sonra Traefik'e bağlar. /api/healthz DB'ye bağımlı
    # değil → app serve eder etmez healthy olur (flap yok). node:20-alpine'de global fetch var.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      # 🔴 KALICI 000 FIX (2026-06-28, Opus analizi): start_period 40sn YETMİYORDU.
      # Order tablosunu kilitleyen migration (CREATE UNIQUE INDEX) varken app'in ilk
      # healthz'i 40sn'i aşıyor → container "healthy" olamıyor → Coolify Traefik router'ını
      # HİÇ bağlamıyor → kalıcı 000 (elle Stop→Start gerekiyordu). DDL'siz deploy'lar 2sn'de
      # bitip kendiliğinden düzeliyordu (gözlemlenen korelasyon). 120sn + 10 retry, kilitleyen
      # migrate'i + 8GB kutudaki RAM baskısını absorbe eder (start_period'da fail retry saymaz).
      retries: 10
      start_period: 120s

  # ── BullMQ Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile        # ana Dockerfile'ın `worker` stage'i (deps paylaşımlı, OOM fix)
      target: worker
    container_name: ebay_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ebay_user:ebay_pass@postgres:5432/ebay_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    # 🔴 migrate'e BAĞLI DEĞİL (bilinçli, 2026-06-28). Eskiden `migrate:
    # service_completed_successfully` vardı → migration FAIL/HANG edince app/worker HİÇ
    # başlamıyor, site komple 503 oluyordu (tek hata noktası). Artık migrate ayrı çalışır;
    # fail etse bile app/worker ayağa kalkar. Migration'lar additive + app eksik kısıtla
    # zarif çalışır (ör. order dedup → DB unique yoksa findFirst guard devrede).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ebay_net

  # ── Günlük Yedek (PostgreSQL) ──────────────────────────────────────────────
  # Script container'a GÖMÜLÜ (dış dosya mount'u yok — Coolify'da tek-dosya bind çalışmıyor).
  # Yedekler kalıcı named volume'da (backups_data). Her gün 03:00'te pg_dump + gzip, 30 gün saklar.
  backup:
    image: postgres:16-alpine
    container_name: ebay_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ebay_pass
    volumes:
      - backups_data:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /backup.sh <<'EOF'
        #!/bin/sh
        set -e
        DATE=$$(date +%Y%m%d_%H%M%S)
        FILE="/backups/ebay_db_$${DATE}.sql.gz"
        echo "[$$(date '+%F %T')] Yedek basliyor..."
        pg_dump -h postgres -U ebay_user -d ebay_db --no-password --clean --if-exists | gzip > "$$FILE"
        echo "[$$(date '+%F %T')] Tamam: $$FILE ($$(du -h "$$FILE" | cut -f1))"
        find /backups -name "*.sql.gz" -mtime +30 -delete
        EOF
        chmod +x /backup.sh
        echo "0 3 * * * sh /backup.sh >> /backups/backup.log 2>&1" | crontab -
        echo "[backup] cron kuruldu (03:00 gunluk). Ilk yedek simdi aliniyor..."
        sh /backup.sh || echo "[backup] ilk yedek hatasi (postgres hazir olmayabilir)"
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebay_net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backups_data:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  ebay_net:
    driver: bridge
