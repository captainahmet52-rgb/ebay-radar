version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ebay_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ebay_db
      POSTGRES_USER: ebay_user
      POSTGRES_PASSWORD: ebay_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebay_user -d ebay_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ebay_net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ebay_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ebay_net

  # ── Prisma Migrate (app/worker'dan önce çalışır, bir kez) ─────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: ebay_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ebay_user:ebay_pass@postgres:5432/ebay_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebay_net
    restart: "no"

  # ── Next.js App ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebay_app
    restart: unless-stopped
    env_file: .env
    environment:
      # Coolify sihirli değişkeni: app servisini 3000 portunda + domaine bağlar.
      # (Traefik loadbalancer port'unu deterministik yapar — redeploy'da kaybolmaz.)
      SERVICE_FQDN_APP_3000: "https://leanautomation.pro"
      DATABASE_URL: postgresql://ebay_user:ebay_pass@postgres:5432/ebay_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ebay_net
    ports:
      - "3000:3000"
    expose:
      - "3000"
    labels:
      # Traefik backend port'unu SABİTLE — Coolify'ın otomatik port bağı bazen
      # "Reload Compose File"da kayboluyor ve 504 veriyordu. UUID bu kaynağa özel/sabit.
      - "traefik.http.services.http-0-keruvce6zrt77e7z1zis4zbz-app.loadbalancer.server.port=3000"
      - "traefik.http.services.https-0-keruvce6zrt77e7z1zis4zbz-app.loadbalancer.server.port=3000"
      # App iki ağda; Traefik'in coolify-proxy ile ORTAK ağı (keruvce...) kullanmasını
      # zorla — yoksa yanlış ağdaki IP'ye gidip 503 veriyor.
      - "traefik.docker.network=keruvce6zrt77e7z1zis4zbz"

  # ── BullMQ Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ebay_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ebay_user:ebay_pass@postgres:5432/ebay_db
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - ebay_net

  # ── Günlük Yedek (PostgreSQL) ──────────────────────────────────────────────
  # Script container'a GÖMÜLÜ (dış dosya mount'u yok — Coolify'da tek-dosya bind çalışmıyor).
  # Yedekler kalıcı named volume'da (backups_data). Her gün 03:00'te pg_dump + gzip, 30 gün saklar.
  backup:
    image: postgres:16-alpine
    container_name: ebay_backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ebay_pass
    volumes:
      - backups_data:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /backup.sh <<'EOF'
        #!/bin/sh
        set -e
        DATE=$$(date +%Y%m%d_%H%M%S)
        FILE="/backups/ebay_db_$${DATE}.sql.gz"
        echo "[$$(date '+%F %T')] Yedek basliyor..."
        pg_dump -h postgres -U ebay_user -d ebay_db --no-password --clean --if-exists | gzip > "$$FILE"
        echo "[$$(date '+%F %T')] Tamam: $$FILE ($$(du -h "$$FILE" | cut -f1))"
        find /backups -name "*.sql.gz" -mtime +30 -delete
        EOF
        chmod +x /backup.sh
        echo "0 3 * * * sh /backup.sh >> /backups/backup.log 2>&1" | crontab -
        echo "[backup] cron kuruldu (03:00 gunluk). Ilk yedek simdi aliniyor..."
        sh /backup.sh || echo "[backup] ilk yedek hatasi (postgres hazir olmayabilir)"
        crond -f -l 2
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ebay_net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backups_data:
    driver: local

# ── Network ────────────────────────────────────────────────────────────────
networks:
  ebay_net:
    driver: bridge
